<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440">
  <defs>
    <style>
      text { font-family: 'SF Mono','Fira Code','Cascadia Code',ui-monospace,monospace; font-size: 12.5px; }
    </style>
    <clipPath id="inner"><rect x="8" y="8" width="884" height="424" rx="6"/></clipPath>
  </defs>

  <!-- outer shell -->
  <rect width="900" height="440" rx="8" fill="#161b22"/>
  <!-- terminal chrome bar -->
  <rect x="0" y="0" width="900" height="32" rx="8" fill="#1c2128"/>
  <rect x="0" y="24" width="900" height="8" fill="#1c2128"/>
  <!-- traffic lights -->
  <circle cx="20" cy="16" r="6" fill="#ff5f57"/>
  <circle cx="40" cy="16" r="6" fill="#febc2e"/>
  <circle cx="60" cy="16" r="6" fill="#28c840"/>
  <text x="450" y="20" text-anchor="middle" fill="#8b949e" font-size="12">file-syncer-cmp compare --dest nas.json mnt3.json mnt4.json --fuzzy --tui</text>

  <!-- terminal body -->
  <rect x="0" y="32" width="900" height="408" fill="#0d1117" clip-path="url(#inner)"/>


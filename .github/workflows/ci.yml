name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Build (native)
        run: go build -ldflags="-X main.version=ci" ./...

      - name: Vet
        run: go vet ./...

      - name: Cross-compile all targets
        if: matrix.os == 'ubuntu-latest'
        run: |
          LDFLAGS="-X main.version=ci"
          GOOS=linux  GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o /dev/null .
          GOOS=linux  GOARCH=arm64 go build -ldflags="${LDFLAGS}" -o /dev/null .
          GOOS=darwin GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o /dev/null .
          GOOS=darwin GOARCH=arm64 go build -ldflags="${LDFLAGS}" -o /dev/null .
